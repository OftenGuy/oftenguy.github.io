
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoat Wormy Text Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #F1F1F1;
    color: #222;
    padding: 25px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

textarea, select {
    width: 100%;
    padding: 10px;
    margin-top: 7px;
    font: inherit;
    border: 1px solid #CCC;
    border-radius: 5px;
}

input[type="range"] {
    width: 100%;
    margin-top: 10px;
}

input[type="color"] {
    width: 55px;
    height: 35px;
    margin-top: 7px;
    cursor: pointer;
}

.preview {
    background: white;
    border: 1px solid #CCC;
    border-radius: 6px;
    padding: 25px;
    min-height: 100px;
    overflow-wrap: anywhere;
    font-family: serif;
    font-size: 26px;
    line-height: 2;
}

.char {
    display: inline-block;
    white-space: pre;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 5px;
    background: #333;
    color: white;
    cursor: pointer;
    margin-top: 12px;
    margin-right: 5px;
}

button:hover {
    background: #555;
}

.color-settings {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px;
    background: #E8E8E8;
    border-radius: 6px;
    margin-top: 10px;
}

.color-settings label {
    margin-top: 0;
}

.value {
    font-weight: normal;
    color: #666;
}

h3 {
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h2>Stoat Wormy Text Generator</h2>

<label for="input">Text</label>
<textarea id="input" rows="3">can you do the woooooooooooooooooorm?</textarea>

<label for="pattern">Worm Pattern</label>
<select id="pattern">
    <option value="random">Random</option>
    <option value="perfect" selected>Perfect Worm</option>
    <option value="reverse">Reverse Worm</option>
    <option value="sine">Smooth Wave</option>
    <option value="flat">Flat</option>
</select>

<label>
    Worm Height: <span class="value" id="heightValue">2</span>
</label>
<input type="range" id="height" min="0" max="15" value="2">

<label>
    Wave Length: <span class="value" id="waveValue">8</span>
</label>
<input type="range" id="wave" min="2" max="30" value="8">

<label for="colorPattern">Color Pattern</label>
<select id="colorPattern">
    <option value="none">None</option>
    <option value="rainbow">Rainbow</option>
    <option value="gradient">Gradient</option>
    <option value="alternating">Alternating</option>
    <option value="custom">Custom Colors</option>
</select>

<div class="color-settings">
    <div>
        <label for="color1">Color 1</label>
        <input type="color" id="color1" value="#ff0000">
    </div>

    <div>
        <label for="color2">Color 2</label>
        <input type="color" id="color2" value="#00ff00">
    </div>

    <div>
        <label for="color3">Color 3</label>
        <input type="color" id="color3" value="#0000ff">
    </div>
</div>

<label>
    Font Size: <span class="value" id="fontValue">26</span>
</label>
<input type="range" id="fontSize" min="12" max="60" value="26">

<label for="font">Font Family</label>
<select id="font">
    <option value="serif">Serif</option>
    <option value="Arial, sans-serif">Arial</option>
    <option value="'Times New Roman', serif">Times New Roman</option>
    <option value="monospace">Monospace</option>
    <option value="cursive">Cursive</option>
</select>

<h3>Preview</h3>
<div class="preview" id="preview"></div>

<button id="regenerate">Regenerate</button>
<button id="copy">Copy LaTeX</button>
<button id="copyText">Copy Plain Text</button>

<h3>LaTeX Output</h3>
<textarea id="output" rows="10" readonly></textarea>

</div>

<script>
const $ = id => document.getElementById(id);

// Convert HEX to RGB
function hexToRgb(hex) {
    return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
}

// Blend two colors
function mixColors(c1, c2, amount) {
    const a = hexToRgb(c1);
    const b = hexToRgb(c2);

    const r = Math.round(a.r + (b.r - a.r) * amount);
    const g = Math.round(a.g + (b.g - a.g) * amount);
    const blue = Math.round(a.b + (b.b - a.b) * amount);

    return "#" + [r, g, blue]
        .map(v => v.toString(16).padStart(2, "0"))
        .join("");
}

// Generate colors
function getColor(i, total, pattern) {
    const c1 = $("color1").value;
    const c2 = $("color2").value;
    const c3 = $("color3").value;

    switch (pattern) {
        case "rainbow":
            return hslToHex((i * 360 / 12) % 360, 100, 50);

        case "gradient":
            return mixColors(
                c1,
                c2,
                i / Math.max(total - 1, 1)
            );

        case "alternating":
            return i % 2 === 0 ? c1 : c2;

        case "custom":
            return [c1, c2, c3][i % 3];

        default:
            return "#000000";
    }
}

// Convert HSL to HEX
function hslToHex(h, s, l) {
    s /= 100;
    l /= 100;

    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);

    const f = n =>
        l - a * Math.max(-1, Math.min(
            k(n) - 3,
            9 - k(n),
            1
        ));

    return "#" + [f(0), f(8), f(4)]
        .map(v => Math.round(v * 255)
            .toString(16).padStart(2, "0"))
        .join("");
}

// Escape LaTeX special characters
function escapeLatex(char) {
    const replacements = {
        "\\": "\\textbackslash{}",
        "{": "\\{",
        "}": "\\}",
        "$": "\\$",
        "&": "\\&",
        "#": "\\#",
        "%": "\\%",
        "_": "\\_",
        "^": "\\textasciicircum{}",
        "~": "\\textasciitilde{}",
        " ": "\\ "
    };

    return replacements[char] ?? char;
}

// Generate text
function generate() {
    const text = $("input").value;
    const height = Number($("height").value);
    const wave = Number($("wave").value);
    const fontSize = Number($("fontSize").value);

    const pattern = $("pattern").value;
    const colorPattern = $("colorPattern").value;

    const preview = $("preview");
    preview.replaceChildren();

    preview.style.fontSize = fontSize + "px";
    preview.style.fontFamily = $("font").value;

    let latexCharacters = "";

    for (let i = 0; i < text.length; i++) {
        const char = text[i];

        // Worm positioning
        let offset = 0;

        switch (pattern) {
            case "random":
                offset = (Math.random() * 2 - 1) * height;
                break;

            case "perfect":
            case "sine":
                offset = Math.sin(i * Math.PI / wave) * height;
                break;

            case "reverse":
                offset = -Math.sin(i * Math.PI / wave) * height;
                break;

            case "flat":
                offset = 0;
                break;
        }

        offset = Math.round(offset);

        // Character color
        const color = getColor(
            i,
            text.length,
            colorPattern
        );

        // Preview
        const span = document.createElement("span");

        span.className = "char";
        span.textContent = char;
        span.style.transform = `translateY(${-offset}px)`;
        span.style.color = color;

        preview.appendChild(span);

        // LaTeX output
        const escaped = escapeLatex(char);

        let latexChar =
            `\\raisebox{${offset}pt}{${escaped}}`;

        if (colorPattern !== "none") {
            const hex = color.replace("#", "").toLowerCase();

            latexChar =
                `\\raisebox{${offset}pt}{\\color{${hex}}${escaped}}`;
        }

        latexCharacters += latexChar;
    }

    // Final LaTeX expression
    const latex = `$$\\textsf{${latexCharacters}}$$`;

    $("output").value = latex;

    $("heightValue").textContent = height;
    $("waveValue").textContent = wave;
    $("fontValue").textContent = fontSize;
}

// Regenerate when settings change
[
    "input",
    "height",
    "wave",
    "fontSize",
    "pattern",
    "colorPattern",
    "color1",
    "color2",
    "color3",
    "font"
].forEach(id => {
    $(id).addEventListener("input", generate);
    $(id).addEventListener("change", generate);
});

// Regenerate button
$("regenerate").addEventListener("click", generate);

// Copy LaTeX
$("copy").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText($("output").value);
        $("copy").textContent = "Copied!";
    } catch {
        $("output").select();
        document.execCommand("copy");
        $("copy").textContent = "Copied!";
    }

    setTimeout(() => {
        $("copy").textContent = "Copy LaTeX";
    }, 1200);
});

// Copy plain text
$("copyText").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText($("input").value);
        $("copyText").textContent = "Copied!";
    } catch {
        $("input").select();
        document.execCommand("copy");
        $("copyText").textContent = "Copy Plain Text";
    }

    setTimeout(() => {
        $("copyText").textContent = "Copy Plain Text";
    }, 1200);
});

// Initial generation
generate();
</script>

</body>
</html>
