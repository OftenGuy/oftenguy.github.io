
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wormy Text Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #F1F1F1, #E9E9E9);
        color: #222;
        padding: 25px;
    }

    .container {
        max-width: 700px;
        margin: auto;
    }

    h2 {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    textarea, select {
        width: 100%;
        padding: 10px;
        margin-top: 7px;
        font: inherit;
        border: 1px solid #CCC;
        background: linear-gradient(to bottom, #FFFFFF, #EEEEEE);
        border-radius: 5px;
    }

    input[type="range"] {
        width: 100%;
        margin-top: 10px;
    }

    input[type="color"] {
        width: 55px;
        height: 35px;
        margin-top: 7px;
        cursor: pointer;
    }

    .preview {
        background: white;
        border: 1px solid #CCC;
        border-radius: 6px;
        padding: 25px;
        min-height: 100px;
        overflow-wrap: anywhere;
        font-family: serif;
        font-size: 26px;
        line-height: 2;
    }

    .char {
        display: inline-block;
        white-space: pre;
    }

    button {
        padding: 11px 18px;
        border: none;
        border-radius: 5px;
        background: linear-gradient(to bottom, #666 0%, #555 25%, #333 50%, #222 100%);
        color: white;
        cursor: pointer;
        margin-top: 12px;
        margin-right: 5px;
    }

    button:hover {
        background: #555;
    }

    .color-settings {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 12px;
        background: #E8E8E8;
        border-radius: 6px;
        margin-top: 10px;
    }

    .color-settings label {
        margin-top: 0;
    }

    .output {
        margin-top: 20px;
    }

    .hidden {
        display: none;
    }

    .value {
        font-weight: normal;
        color: #666;
    }
</style>
</head>

<body>

<div class="container">

<h2>Wormy Text Generator</h2>

<label>Text</label>
<textarea id="input" rows="3">can you do the woooooooooooooooooorm?</textarea>

<label>Worm Pattern</label>
<select id="pattern">
    <option value="random" title="Random">Random</option>
    <option value="perfect" title="Perfect Worm" selected>Perfect Worm</option>
    <option value="reverse" title="Reverse Worm">Reverse Worm</option>
    <option value="sine" title="Smooth Wave">Smooth Wave</option>
    <option value="flat" title="Flat">Flat</option>
</select>

<label>
    Worm Height: <span class="value" id="heightValue">2</span>
</label>
<input type="range" id="height" min="0" max="15" value="2">

<label>
    Wave Length: <span class="value" id="waveValue">8</span>
</label>
<input type="range" id="wave" min="2" max="30" value="8">

<label>Color Pattern</label>
<select id="colorPattern">
    <option value="none" title="None">None</option>
    <option value="rainbow" title="Rainbow">Rainbow</option>
    <option value="gradient" title="Gradient">Gradient</option>
    <option value="alternating" title="Alternating">Alternating</option>
    <option value="custom" title="Custom Colors">Custom Colors</option>
</select>

<div class="color-settings" id="colorSettings">

    <div>
        <label>Color 1</label>
        <input type="color" id="color1" value="#FF0000">
    </div>

    <div>
        <label>Color 2</label>
        <input type="color" id="color2" value="#00FF00">
    </div>

    <div>
        <label>Color 3</label>
        <input type="color" id="color3" value="#0000FF">
    </div>

</div>

<label>
    Font Size: <span class="value" id="fontValue">26</span>
</label>
<input type="range" id="fontSize" min="12" max="60" value="26">

<label>Font Family</label>
<select id="font">
    <option value="serif" title="Serif">Serif</option>
    <option value="Arial, sans-serif" title="Arial">Arial</option>
    <option value="'Times New Roman', serif" title="Times New Roman">Times New Roman</option>
    <option value="monospace" title="Monospace">Monospace</option>
    <option value="cursive" title="Cursive">Cursive</option>
</select>

<h3>Preview</h3>
<div class="preview" id="preview"></div>

<button id="regenerate" title="Regenerate">Regenerate</button>
<button id="copy" title="Copy LaTeX">Copy LaTeX</button>
<button id="copyText" title="Copy Plain Text">Copy Plain Text</button>

<div class="output">
    <h3>LaTeX Output</h3>
    <textarea id="output" rows="7" readonly></textarea>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

function hexToRgb(hex) {
    return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
}

function mixColors(c1, c2, amount) {
    const a = hexToRgb(c1);
    const b = hexToRgb(c2);

    const r = Math.round(a.r + (b.r - a.r) * amount);
    const g = Math.round(a.g + (b.g - a.g) * amount);
    const bValue = Math.round(a.b + (b.b - a.b) * amount);

    return `rgb(${r}, ${g}, ${bValue})`;
}

function getColor(i, total, pattern) {
    const c1 = $("color1").value;
    const c2 = $("color2").value;
    const c3 = $("color3").value;

    switch (pattern) {

        case "rainbow":
            return `hsl(${(i * 360 / 12) % 360}, 100%, 50%)`;

        case "gradient":
            return mixColors(c1, c2, i / Math.max(total - 1, 1));

        case "alternating":
            return i % 2 === 0 ? c1 : c2;

        case "custom":
            return [c1, c2, c3][i % 3];

        default:
            return "inherit";
    }
}

// Escape special LaTeX characters
function escapeLatex(char) {
    const replacements = {
        "\\": "\\textbackslash{}",
        "{": "\\{",
        "}": "\\}",
        "$": "\\$",
        "&": "\\&",
        "#": "\\#",
        "%": "\\%",
        "_": "\\_",
        "^": "\\textasciicircum{}",
        "~": "\\textasciitilde{}",
        " ": "\\ "
    };

    return replacements[char] || char;
}

function generate() {

    const text = $("input").value;
    const height = Number($("height").value);
    const wave = Number($("wave").value);
    const fontSize = Number($("fontSize").value);

    const pattern = $("pattern").value;
    const colorPattern = $("colorPattern").value;

    const preview = $("preview");
    preview.replaceChildren();

    preview.style.fontSize = fontSize + "px";
    preview.style.fontFamily = $("font").value;

    let latex = "$$\\textsf{";

    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        let offset = 0;

        switch (pattern) {
            case "random":
                offset = (Math.random() * 2 - 1) * height;
                break;

            case "perfect":
            case "sine":
                offset = Math.sin(i * Math.PI / wave) * height;
                break;

            case "reverse":
                offset = -Math.sin(i * Math.PI / wave) * height;
                break;

            case "flat":
                offset = 0;
                break;
        }

        offset = Math.round(offset);

        const span = document.createElement("span");

        span.className = "char";
        span.textContent = char;
        span.style.transform = `translateY(${-offset}px)`;
        span.style.color = getColor(i, text.length, colorPattern);

        preview.appendChild(span);

        latex += `\\raisebox{${offset}pt}{${escapeLatex(char)}}`;
    }

    latex += "}$$";

    $("output").value = latex;

    $("heightValue").textContent = height;
    $("waveValue").textContent = wave;
    $("fontValue").textContent = fontSize;
}

// Controls
[
    "input",
    "height",
    "wave",
    "fontSize",
    "pattern",
    "colorPattern",
    "color1",
    "color2",
    "color3",
    "font"
].forEach(id => {
    $(id).addEventListener("input", generate);
    $(id).addEventListener("change", generate);
});

// Buttons
$("regenerate").addEventListener("click", generate);

$("copy").addEventListener("click", async () => {
    await navigator.clipboard.writeText($("output").value);
    $("copy").textContent = "Copied!";
    setTimeout(() => $("copy").textContent = "Copy LaTeX", 1200);
});

$("copyText").addEventListener("click", async () => {
    await navigator.clipboard.writeText($("input").value);
    $("copyText").textContent = "Copied!";
    setTimeout(() => $("copyText").textContent = "Copy Plain Text", 1200);
});

generate();
</script>

</body>
</html>
